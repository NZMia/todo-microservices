version: 0.2

phases:
  install:
    commands:
      - echo "Checking Node and Docker versions"
      - node -v
      - docker --version
      - echo "Setting image tag from CodeBuild build number"
      - export IMAGE_TAG=build-$CODEBUILD_BUILD_NUMBER

  pre_build:
    commands:
      - echo "Logging in to Amazon ECR"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPOSITORY_URL
      - echo "Installing frontend dependencies"
      - cd frontend
      - npm install

  build:
    commands:
      - echo "Running frontend tests"
      - CI=true npm test -- --watchAll=false
      - echo "Building frontend Docker image with tag $IMAGE_TAG"
      - docker build -t $ECR_REPOSITORY_URL:$IMAGE_TAG .
      - cd ..

  post_build:
    commands:
      - echo "Pushing frontend image to ECR"
      - docker push $ECR_REPOSITORY_URL:$IMAGE_TAG
      - echo "Writing imagedefinitions.json"
      - printf '[{"name":"service-a","imageUri":"%s"}]' $ECR_REPOSITORY_URL:$IMAGE_TAG > imagedefinitions.json
      - echo "Writing taskdef.json for CodeDeploy"
      - |
        cat > taskdef.json << EOF
        {
          "family": "dce04-service-a",
          "networkMode": "awsvpc",
          "requiresCompatibilities": ["FARGATE"],
          "cpu": "256",
          "memory": "512",
          "executionRoleArn": "$ECS_TASK_EXECUTION_ROLE_ARN",
          "containerDefinitions": [
            {
              "name": "service-a",
              "image": "$ECR_REPOSITORY_URL:$IMAGE_TAG",
              "essential": true,
              "portMappings": [{ "containerPort": 5050, "protocol": "tcp" }]
            }
          ]
        }
        EOF
      - echo "Writing appspec.yml for CodeDeploy"
      - |
        cat > appspec.yml << EOF
        version: 0.0
        Resources:
          - TargetService:
              Type: AWS::ECS::Service
              Properties:
                TaskDefinition: <TASK_DEFINITION>
                LoadBalancerInfo:
                  ContainerName: "service-a"
                  ContainerPort: 5050
        EOF

artifacts:
  files:
    - imagedefinitions.json
    - taskdef.json
    - appspec.yml
    